<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gita Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: one centred reading column, the verse card is the whole page; controls sit under it like a colophon. */
:root {
  --paper: #f6efe4;          /* warm unbleached paper */
  --ink: #2a1a16;            /* near-black with madder bias */
  --madder: #7b1f2b;         /* the single hue */
  --madder-soft: #a05a60;    /* same hue, lifted: IAST, eyebrows */
  --rule: #d9c7b6;           /* paper darkened, not grey */
  --wash: #efe3d3;           /* button hover / list stripe */
  --font-sa: 'Tiro Devanagari Sanskrit', 'Noto Serif Devanagari', 'Kohinoor Devanagari', serif;
  --font-en: 'EB Garamond', Garamond, 'Iowan Old Style', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1a1214; --ink: #efe3d8; --madder: #d9857f; --madder-soft: #a8766f;
    --rule: #3a2a2b; --wash: #241a1c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1a1214; --ink: #efe3d8; --madder: #d9857f; --madder-soft: #a8766f;
  --rule: #3a2a2b; --wash: #241a1c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-en); font-size: 18px; line-height: 1.5;
  padding-inline: 20px; padding-block: 0;
  display: flex; flex-direction: column; min-height: 100%;
}
main { flex: 1; width: 100%; max-width: 38rem; margin: 0 auto; padding-block: clamp(2rem, 7vh, 5rem) 2rem; }
.plate { margin: 0 0 1.75rem; }
.plate img { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; }
.eyebrow {
  font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--madder-soft);
  display: flex; justify-content: space-between; gap: 1rem; font-variant-numeric: tabular-nums;
}
h1.heading {
  font-family: var(--font-en); font-weight: 500; font-size: clamp(1.7rem, 5.5vw, 2.3rem); line-height: 1.15;
  color: var(--madder); margin: .5rem 0 2rem; text-wrap: balance;
}
.sa { font-family: var(--font-sa); font-size: clamp(1.35rem, 4.5vw, 1.6rem); line-height: 1.75; margin: 0; }
.sa p, .tr p { margin: 0; }
.tr { font-family: var(--font-sa); font-style: italic; color: var(--madder-soft); font-size: 1.05rem; line-height: 1.6; margin: 1rem 0 0; }
hr.rule { border: 0; height: 1px; background: var(--rule); margin: 1.75rem 0; width: 4rem; }
.en { font-size: 1.25rem; line-height: 1.55; margin: 0; max-width: 34rem; }
.controls { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; margin-top: 3rem; }
button.draw {
  font: inherit; font-size: 1rem; letter-spacing: .04em; color: var(--madder); background: transparent;
  border: 1px solid var(--madder); border-radius: 2px; padding: .6rem 1.4rem; cursor: pointer;
}
button.draw:hover { background: var(--wash); }
button.draw:focus-visible, button.plain:focus-visible, .list a:focus-visible { outline: 2px solid var(--madder); outline-offset: 3px; }
button.plain { font: inherit; font-size: .95rem; color: var(--madder-soft); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: .2em; }
.hint { font-size: .85rem; color: var(--madder-soft); margin-top: 1rem; }
footer { width: 100%; max-width: 38rem; margin: 0 auto; padding-block: 1.5rem; border-top: 1px solid var(--rule); font-size: .85rem; color: var(--madder-soft); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
footer a { color: inherit; }
.list { margin-top: 2.5rem; }
.list h2 { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--madder-soft); font-weight: 400; margin: 1.5rem 0 .5rem; }
.list ol { list-style: none; padding: 0; margin: 0; }
.list li { display: grid; grid-template-columns: 4.5rem 1fr; gap: .5rem; padding: .3rem 0; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.list li span { color: var(--madder-soft); }
.list a { color: var(--ink); text-decoration: none; }
.list a:hover { color: var(--madder); }
.card { transition: opacity .25s ease; }
.card.out { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<main>
  <article class="card" id="card" aria-live="polite">
    <figure class="plate" id="plate" hidden><img id="plateimg" alt="" width="1120" height="1400"></figure>
    <div class="eyebrow"><span>Bhagavad Gītā</span><span id="ref"></span></div>
    <h1 class="heading" id="heading"></h1>
    <div class="sa" id="dev" lang="sa"></div>
    <div class="tr" id="iast" lang="sa-Latn"></div>
    <hr class="rule">
    <p class="en" id="en"></p>
  </article>
  <div class="controls">
    <button class="draw" id="draw" type="button">Draw another</button>
    <button class="plain" id="toggle" type="button">All verses</button>
  </div>
  <section class="list" id="list" hidden></section>
</main>
<footer>
  <span><span id="count"></span> verses that stand alone</span>
  <span>Lexiglass</span>
</footer>

<script>
const DATA = [{"ref": "2.3", "img": "img/2.3.jpg", "ch": 2, "h": "Do not give in to this weakness", "d": ["क्लैब्यं मा स्म गमः पार्थ नैतत्त्वय्युपपद्यते।", "क्षुद्रं हृदयदौर्बल्यं त्यक्त्वोत्तिष्ठ परन्तप॥"], "t": ["klaibyaṁ mā sma gamaḥ pārtha naitat tvayyupapadyate", "kṣudraṁ hṛdaya-daurbalyaṁ tyaktvottiṣṭha parantapa"], "e": "This weakness does not suit you, Arjuna. Shake off this smallness of heart and stand up."}, {"ref": "2.11", "img": "img/2.11.jpg", "ch": 2, "h": "What the wise do not mourn", "d": ["अशोच्यानन्वशोचस्त्वं प्रज्ञावादांश्च भाषसे।", "गतासूनगतासूंश्च नानुशोचन्ति पण्डिताः॥"], "t": ["aśocyān-anvaśocas-tvaṁ prajñā-vādāṁś ca bhāṣase", "gatāsūn-agatāsūṁś-ca nānuśocanti paṇḍitāḥ"], "e": "You grieve for those who need no grieving, and you speak like someone wise. The wise mourn neither the living nor the dead."}, {"ref": "2.13", "img": "img/2.13.jpg", "ch": 2, "h": "The one who stays through every change", "d": ["देहिनोऽस्मिन्यथा देहे कौमारं यौवनं जरा।", "तथा देहान्तरप्राप्तिर्धीरस्तत्र न मुह्यति॥"], "t": ["dehino ’smin yathā dehe kaumāraṁ yauvanaṁ jarā", "tathā dehāntara-prāptir dhīras tatra na muhyati"], "e": "Just as the one in this body passes through childhood, youth and old age, so it passes into another body. The steady are not confused by this."}, {"ref": "2.14", "img": "img/2.14.jpg", "ch": 2, "h": "Sensations have weather", "d": ["मात्रास्पर्शास्तु कौन्तेय शीतोष्णसुखदुःखदाः।", "आगमापायिनोऽनित्यास्तांस्तितिक्षस्व भारत॥"], "t": ["mātrā-sparśās tu kaunteya śītoṣṇa-sukha-duḥkha-dāḥ", "āgamāpāyino ’nityās taṁs-titikṣasva bhārata"], "e": "Heat and cold, pleasure and pain come from the senses meeting the world. They come and they go; they do not last. Bear them."}, {"ref": "2.15", "img": "img/2.15.jpg", "ch": 2, "h": "Who is fit for what does not die", "d": ["यं हि न व्यथयन्त्येते पुरुषं पुरुषर्षभ।", "समदुःखसुखं धीरं सोऽमृतत्वाय कल्पते॥"], "t": ["yaṁ hi na vyathayantyete puruṣaṁ puruṣarṣabha", "sama-duḥkha-sukhaṁ dhīraṁ so ’mṛtatvāya kalpate"], "e": "The person these do not disturb, who is the same in pain and pleasure and stays steady, is fit for what does not die."}, {"ref": "2.16", "img": "img/2.16.jpg", "ch": 2, "h": "What is real never ceases", "d": ["नासतो विद्यते भावो नाभावो विद्यते सतः।", "उभयोरपि दृष्टोऽन्तस्त्वनयोस्तत्त्वदर्शिभिः॥"], "t": ["nāsato vidyate bhāvo nābhāvo vidyate sataḥ", "ubhayorapi dṛṣṭo ’nta stvanayos tattva-darśibhiḥ"], "e": "What is unreal never comes to be; what is real never stops being. Those who see the truth have seen the end of both."}, {"ref": "2.20", "img": "img/2.20.jpg", "ch": 2, "h": "Never born, never dying", "d": ["न जायते म्रियते वा कदाचिन्नायं भूत्वा भविता वा न भूयः।", "अजो नित्यः शाश्वतोऽयं पुराणो न हन्यते हन्यमाने शरीरे॥"], "t": ["na jāyate mriyate vā kadācin", "nāyaṁ bhūtvā bhavitā vā na bhūyaḥ", "ajo nityaḥ śāśvato ’yaṁ purāṇo", "na hanyate hanyamāne śarīre"], "e": "It is never born and it never dies. It did not come into being once and will not come into being again. Unborn, eternal, ever-present, ancient, it is not killed when the body is killed."}, {"ref": "2.22", "img": "img/2.22.jpg", "ch": 2, "h": "Worn-out clothes", "d": ["वासांसि जीर्णानि यथा विहाय नवानि गृह्णाति नरोऽपराणि।", "तथा शरीराणि विहाय जीर्णान्यन्यानि संयाति नवानि देही॥"], "t": ["vāsāṁsi jīrṇāni yathā vihāya", "navāni gṛhṇāti naro ’parāṇi", "tathā śarīrāṇi vihāya jīrṇāny", "anyāni saṁyāti navāni dehī"], "e": "As a person throws away worn-out clothes and puts on new ones, so the one within throws away worn-out bodies and takes on others that are new."}, {"ref": "2.23", "img": "img/2.23.jpg", "ch": 2, "h": "What no weapon can reach", "d": ["नैनं छिन्दन्ति शस्त्राणि नैनं दहति पावकः।", "न चैनं क्लेदयन्त्यापो न शोषयति मारुतः॥"], "t": ["nainaṁ chindanti śastrāṇi nainaṁ dahati pāvakaḥ", "na cainaṁ kledayantyāpo na śoṣayati mārutaḥ"], "e": "Weapons cannot cut it, fire cannot burn it, water cannot wet it, wind cannot dry it."}, {"ref": "2.27", "img": "img/2.27.jpg", "ch": 2, "h": "No grief over what cannot be avoided", "d": ["जातस्य हि ध्रुवो मृत्युर्ध्रुवं जन्म मृतस्य च।", "तस्मादपरिहार्येऽर्थे न त्वं शोचितुमर्हसि॥"], "t": ["jātasya hi dhruvo mṛtyur dhruvaṁ janma mṛtasya ca", "tasmād aparihārye ’rthe na tvaṁ śocitum arhasi"], "e": "For the one who is born, death is certain; for the one who dies, birth is certain. Over what cannot be avoided, you should not grieve."}, {"ref": "2.28", "img": "img/2.28.jpg", "ch": 2, "h": "Why lament the middle?", "d": ["अव्यक्तादीनि भूतानि व्यक्तमध्यानि भारत।", "अव्यक्तनिधनान्येव तत्र का परिदेवना॥"], "t": ["avyaktādīni bhūtāni vyakta-madhyāni bhārata", "avyakta-nidhanānyeva tatra kā paridevanā"], "e": "Beings are unseen before they begin, seen in the middle, and unseen again at the end. What is there to lament?"}, {"ref": "2.29", "img": "img/2.29.jpg", "ch": 2, "h": "Permission not to understand", "d": ["आश्चर्यवत्पश्यति कश्चिदेन माश्चर्यवद्वदति तथैव चान्यः।", "आश्चर्यवच्चैनमन्यः शृणोति श्रुत्वाप्येनं वेद न चैव कश्चित्॥"], "t": ["āścarya-vat paśyati kaścid enam", "āścarya-vad vadati tathaiva cānyaḥ", "āścarya-vac cainam anyaḥ śṛṇoti", "śrutvāpyenaṁ veda na caiva kaścit"], "e": "One sees it as a wonder, another speaks of it as a wonder, another hears of it as a wonder. And having heard, still no one knows it."}, {"ref": "2.38", "img": "img/2.38.jpg", "ch": 2, "h": "Act without the scoreboard", "d": ["सुखदुःखे समे कृत्वा लाभालाभौ जयाजयौ।", "ततो युद्धाय युज्यस्व नैवं पापमवाप्स्यसि॥"], "t": ["sukha-duḥkhe same kṛtvā lābhālābhau jayājayau", "tato yuddhāya yujyasva naivaṁ pāpam avāpsyasi"], "e": "Hold pleasure and pain, gain and loss, victory and defeat as the same, and then gird yourself for the fight. This way you will not incur wrong."}, {"ref": "2.40", "img": "img/2.40.jpg", "ch": 2, "h": "No effort is ever lost", "d": ["नेहाभिक्रमनाशोऽस्ति प्रत्यवायो न विद्यते।", "स्वल्पमप्यस्य धर्मस्य त्रायते महतो भयात्॥"], "t": ["nehābhikrama-nāśo ’sti pratyavāyo na vidyate", "svalpam apyasya dharmasya trāyate mahato bhayāt"], "e": "On this path no effort is lost and no step goes backward. Even a little of this practice protects you from great fear."}, {"ref": "2.41", "img": "img/2.41.jpg", "ch": 2, "h": "One aim", "d": ["व्यवसायात्मिका बुद्धिरेकेह कुरुनन्दन।", "बहुशाखा ह्यनन्ताश्च बुद्धयोऽव्यवसायिनाम्॥"], "t": ["vyavasāyātmikā buddhir ekeha kuru-nandana", "bahu-śākhā hyanantāś ca buddhayo ’vyavasāyinām"], "e": "On this path the resolute mind has a single aim. The minds of the irresolute branch endlessly, in every direction."}, {"ref": "2.46", "img": "img/2.46.jpg", "ch": 2, "h": "The well in a flood", "d": ["यावानर्थ उदपाने सर्वतः संप्लुतोदके।", "तावान्सर्वेषु वेदेषु ब्राह्मणस्य विजानतः॥"], "t": ["yāvān artha udapāne sarvataḥ samplutodake", "tāvāṁsarveṣu vedeṣu brāhmaṇasya vijānataḥ"], "e": "What use is a small well when water floods everywhere? That much use are all the scriptures to the one who has seen."}, {"ref": "2.47", "img": "img/2.47.jpg", "ch": 2, "h": "Your right is to the work alone", "d": ["कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।", "मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि॥"], "t": ["karmaṇy-evādhikāras te mā phaleṣu kadācana", "mā karma-phala-hetur bhūr mā te saṅgo ’stvakarmaṇi"], "e": "You have a right to your work, never to its fruits. Do not let the fruit be your motive, and do not let yourself be attached to doing nothing."}, {"ref": "2.48", "img": "img/2.48.jpg", "ch": 2, "h": "Evenness is yoga", "d": ["योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय।", "सिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते॥"], "t": ["yoga-sthaḥ kuru karmāṇi saṅgaṁ tyaktvā dhanañjaya", "siddhy-asiddhyoḥ samo bhūtvā samatvaṁ yoga ucyate"], "e": "Do your work established in yoga, letting attachment go, the same in success and failure. That evenness of mind is what yoga is."}, {"ref": "2.49", "img": "img/2.49.jpg", "ch": 2, "h": "Take refuge in understanding", "d": ["दूरेण ह्यवरं कर्म बुद्धियोगाद्धनञ्जय।", "बुद्धौ शरणमन्विच्छ कृपणाः फलहेतवः॥"], "t": ["dūreṇa hy-avaraṁ karma buddhi-yogād dhanañjaya", "buddhau śaraṇam anviccha kṛpaṇāḥ phala-hetavaḥ"], "e": "Work done for its results is far beneath work done with a steady mind. Take refuge in understanding. Pitiable are those whose motive is the fruit."}, {"ref": "2.50", "img": "img/2.50.jpg", "ch": 2, "h": "Skill in action", "d": ["बुद्धियुक्तो जहातीह उभे सुकृतदुष्कृते।", "तस्माद्योगाय युज्यस्व योगः कर्मसु कौशलम्॥"], "t": ["buddhi-yukto jahātīha ubhe sukṛta-duṣkṛte", "tasmād yogāya yujyasva yogaḥ karmasu kauśalam"], "e": "The one whose mind is steady sheds both good and bad deeds here, in this life. So give yourself to yoga. Yoga is skill in action."}, {"ref": "2.51", "img": "img/2.51.jpg", "ch": 2, "h": "The place without sorrow", "d": ["कर्मजं बुद्धियुक्ता हि फलं त्यक्त्वा मनीषिणः।", "जन्मबन्धविनिर्मुक्ताः पदं गच्छन्त्यनामयम्॥"], "t": ["karma-jaṁ buddhi-yuktā hi phalaṁ tyaktvā manīṣiṇaḥ", "janma-bandha-vinirmuktāḥ padaṁ gacchanty-anāmayam"], "e": "The wise, with steady minds, give up the fruits born of action. Freed from the bondage of birth, they reach the place where there is no sorrow."}, {"ref": "2.52", "img": "img/2.52.jpg", "ch": 2, "h": "When you are done hearing", "d": ["यदा ते मोहकलिलं बुद्धिर्व्यतितरिष्यति।", "तदा गन्तासि निर्वेदं श्रोतव्यस्य श्रुतस्य च॥"], "t": ["yadā te moha-kalilaṁ buddhir vyatitariṣyati", "tadā gantāsi nirvedaṁ śrotavyasya śrutasya ca"], "e": "When your understanding has crossed the thicket of confusion, you will be indifferent to all you have heard and all you will yet hear."}, {"ref": "2.55", "img": "img/2.55.jpg", "ch": 2, "h": "Content in the self, by the self", "d": ["प्रजहाति यदा कामान् सर्वान् पार्थ मनोगतान्।", "आत्मन्येवात्मना तुष्टः स्थितप्रज्ञस्तदोच्यते॥"], "t": ["prajahāti yadā kāmān sarvān pārtha mano-gatān", "ātmany-evātmanā tuṣṭaḥ sthita-prajñas tadocyate"], "e": "When a person lets go of every desire that enters the mind, and is content in the self by the self alone, that person is called steady in wisdom."}, {"ref": "2.56", "img": "img/2.56.jpg", "ch": 2, "h": "Unshaken", "d": ["दुःखेष्वनुद्विग्नमनाः सुखेषु विगतस्पृहः।", "वीतरागभयक्रोधः स्थितधीर्मुनिरुच्यते॥"], "t": ["duḥkheṣv-anudvigna-manāḥ sukheṣu vigata-spṛhaḥ", "vīta-rāga-bhaya-krodhaḥ sthita-dhīr munir ucyate"], "e": "The one whose mind is not shaken by sorrow and does not hunger for pleasure, who is free of craving, fear and anger, is a sage of steady mind."}, {"ref": "2.58", "img": "img/2.58.jpg", "ch": 2, "h": "The tortoise", "d": ["यदा संहरते चायं कूर्मोऽङ्गानीव सर्वशः।", "इन्द्रियाणीन्द्रियार्थेभ्यस्तस्य प्रज्ञा प्रतिष्ठिता॥"], "t": ["yadā sanharate cāyaṁ kūrmo ’ṅgānīva sarvaśaḥ", "indriyāṇīndriyārthebhyas tasya prajñā pratiṣṭhitā"], "e": "When a person draws the senses back from their objects, as a tortoise draws in its limbs, that person's wisdom is firm."}, {"ref": "2.59", "img": "img/2.59.jpg", "ch": 2, "h": "The taste remains", "d": ["विषया विनिवर्तन्ते निराहारस्य देहिनः।", "रसवर्जं रसोऽप्यस्य परं दृष्ट्वा निवर्तते॥"], "t": ["viṣayā vinivartante nirāhārasya dehinaḥ", "rasa-varjaṁ raso ’pyasya paraṁ dṛṣṭvā nivartate"], "e": "For the one who fasts from them, the objects fall away, but the taste for them remains. Even the taste leaves, once the Highest is seen."}, {"ref": "2.60", "img": "img/2.60.jpg", "ch": 2, "h": "Even the wise are carried off", "d": ["यततो ह्यपि कौन्तेय पुरुषस्य विपश्चितः।", "इन्द्रियाणि प्रमाथीनि हरन्ति प्रसभं मनः॥"], "t": ["yatato hyapi kaunteya puruṣasya vipaścitaḥ", "indriyāṇi pramāthīni haranti prasabhaṁ manaḥ"], "e": "Arjuna, the restless senses carry off the mind by force, even of a wise person who is striving."}, {"ref": "2.62–63", "img": "img/2.62-63.jpg", "ch": 2, "h": "How a fall happens", "d": ["ध्यायतो विषयान्पुंसः सङ्गस्तेषूपजायते।", "सङ्गात् संजायते कामः कामात्क्रोधोऽभिजायते॥", "क्रोधाद्भवति संमोहः संमोहात्स्मृतिविभ्रमः।", "स्मृतिभ्रंशाद् बुद्धिनाशो बुद्धिनाशात्प्रणश्यति॥"], "t": ["dhyāyato viṣayān puṁsaḥ saṅgas teṣūpajāyate", "saṅgāt sañjāyate kāmaḥ kāmāt krodho ’bhijāyate", "krodhād bhavati sammohaḥ sammohāt smṛti-vibhramaḥ", "smṛti-bhraṁśād buddhi-nāśo buddhi-nāśāt praṇaśyati"], "e": "Dwelling on the objects of the senses, a person grows attached to them. From attachment comes desire; from desire, anger. From anger comes confusion; from confusion, loss of memory; from loss of memory, the ruin of judgment; and when judgment is ruined, the person is lost."}, {"ref": "2.64", "img": "img/2.64.jpg", "ch": 2, "h": "Serenity", "d": ["रागद्वेषवियुक्तैस्तु विषयानिन्द्रियैश्चरन्।", "आत्मवश्यैर्विधेयात्मा प्रसादमधिगच्छति॥"], "t": ["rāga-dveṣa-viyuktais tu viṣayān indriyaiś caran", "ātma-vaśyair-vidheyātmā prasādam adhigacchati"], "e": "But the one who moves among things with the senses governed, free of attraction and aversion, and self-controlled, comes to serenity."}, {"ref": "2.65", "img": "img/2.65.jpg", "ch": 2, "h": "Every sorrow ends", "d": ["प्रसादे सर्वदुःखानां हानिरस्योपजायते।", "प्रसन्नचेतसो ह्याशु बुद्धिः पर्यवतिष्ठते॥"], "t": ["prasāde sarva-duḥkhānāṁ hānir asyopajāyate", "prasanna-cetaso hyāśu buddhiḥ paryavatiṣṭhate"], "e": "In serenity every sorrow ends. For the one whose mind is serene, understanding quickly becomes steady."}, {"ref": "2.66", "img": "img/2.66.jpg", "ch": 2, "h": "No peace, no happiness", "d": ["नास्ति बुद्धिरयुक्तस्य न चायुक्तस्य भावना।", "न चाभावयतः शान्तिरशान्तस्य कुतः सुखम्॥"], "t": ["nāsti buddhir-ayuktasya na cāyuktasya bhāvanā", "na cābhāvayataḥ śāntir aśāntasya kutaḥ sukham"], "e": "The unsteady have no understanding and no inward focus. Without focus there is no peace, and without peace, how can there be happiness?"}, {"ref": "2.67", "img": "img/2.67.jpg", "ch": 2, "h": "The wind takes the boat", "d": ["इन्द्रियाणां हि चरतां यन्मनोऽनुविधीयते।", "तदस्य हरति प्रज्ञां वायुर्नावमिवाम्भसि॥"], "t": ["indriyāṇāṁ hi caratāṁ yan mano ’nuvidhīyate", "tadasya harati prajñāṁ vāyur nāvam ivāmbhasi"], "e": "When the mind follows the wandering senses, it carries off a person's understanding as the wind carries off a boat on the water."}, {"ref": "2.69", "img": "img/2.69.jpg", "ch": 2, "h": "Awake at night", "d": ["या निशा सर्वभूतानां तस्यां जागर्ति संयमी।", "यस्यां जाग्रति भूतानि सा निशा पश्यतो मुनेः॥"], "t": ["yā niśā sarva-bhūtānāṁ tasyāṁ jāgarti saṁyamī", "yasyāṁ jāgrati bhūtāni sā niśā paśyato muneḥ"], "e": "What is night to all beings is the time the disciplined are awake. What is waking to all beings is night to the sage who sees."}, {"ref": "2.70", "img": "img/2.70.jpg", "ch": 2, "h": "The ocean", "d": ["आपूर्यमाणमचलप्रतिष्ठं समुद्रमापः प्रविशन्ति यद्वत्।", "तद्वत्कामा यं प्रविशन्ति सर्वे स शान्तिमाप्नोति न कामकामी॥"], "t": ["āpūryamāṇam acala-pratiṣṭhaṁ", "samudram āpaḥ praviśanti yadvat", "tadvat kāmā yaṁ praviśanti sarve", "sa śāntim āpnoti na kāma-kāmī"], "e": "As rivers enter the ocean, which is filled yet stays still, so desires enter the one who is at peace. Not so the one who chases desires."}, {"ref": "2.71", "img": "img/2.71.jpg", "ch": 2, "h": "Walking free", "d": ["विहाय कामान्यः सर्वान्पुमांश्चरति निःस्पृहः।", "निर्ममो निरहंकारः स शांतिमधिगच्छति॥"], "t": ["vihāya kāmān yaḥ sarvān pumāṁś carati niḥspṛhaḥ", "nirmamo nirahankāraḥ sa śāntim adhigacchati"], "e": "The one who gives up all desires and moves through the world without longing, without a sense of ‘mine’ or ‘I’, comes to peace."}, {"ref": "2.72", "img": "img/2.72.jpg", "ch": 2, "h": "Even at the last hour", "d": ["एषा ब्राह्मी स्थितिः पार्थ नैनां प्राप्य विमुह्यति।", "स्थित्वाऽस्यामन्तकालेऽपि ब्रह्मनिर्वाणमृच्छति॥"], "t": ["eṣā brāhmī sthitiḥ pārtha naināṁ prāpya vimuhyati", "sthitvāsyām anta-kāle ’pi brahma-nirvāṇam ṛcchati"], "e": "This is the state of being established in Brahman, Arjuna. Once there, a person is not confused again. Standing in it even at the hour of death, one reaches freedom."}, {"ref": "3.5", "img": "img/3.5.jpg", "ch": 3, "h": "No one is still for a moment", "d": ["न हि कश्िचत्क्षणमपि जातु तिष्ठत्यकर्मकृत्।", "कार्यते ह्यवशः कर्म सर्वः प्रकृतिजैर्गुणैः॥"], "t": ["na hi kaścit kṣaṇam api jātu tiṣṭhatyakarma-kṛt", "kāryate hyavaśaḥ karma sarvaḥ prakṛti-jair guṇaiḥ"], "e": "No one stays without acting even for a moment. Everyone is made to act, helplessly, by the qualities born of nature."}, {"ref": "3.8", "img": "img/3.8.jpg", "ch": 3, "h": "Do what must be done", "d": ["नियतं कुरु कर्म त्वं कर्म ज्यायो ह्यकर्मणः।", "शरीरयात्रापि च ते न प्रसिद्ध्येदकर्मणः॥"], "t": ["niyataṁ kuru karma tvaṁ karma jyāyo hyakarmaṇaḥ", "śarīra-yātrāpi ca te na prasiddhyed akarmaṇaḥ"], "e": "Do the work that is yours to do; action is better than inaction. Even keeping the body going is impossible without action."}, {"ref": "3.9", "img": "img/3.9.jpg", "ch": 3, "h": "Work as offering", "d": ["यज्ञार्थात्कर्मणोऽन्यत्र लोकोऽयं कर्मबन्धनः।", "तदर्थं कर्म कौन्तेय मुक्तसंगः समाचर॥"], "t": ["yajñārthāt karmaṇo ’nyatra loko ’yaṁ karma-bandhanaḥ", "tad-arthaṁ karma kaunteya mukta-saṅgaḥ samācara"], "e": "Work binds this world, except work done as an offering. So do your work for that sake, Arjuna, free of attachment."}, {"ref": "3.19", "img": "img/3.19.jpg", "ch": 3, "h": "Unattached, you reach the highest", "d": ["तस्मादसक्तः सततं कार्यं कर्म समाचर।", "असक्तो ह्याचरन्कर्म परमाप्नोति पूरुषः॥"], "t": ["tasmād asaktaḥ satataṁ kāryaṁ karma samācara", "asakto hyācaran karma param āpnoti pūruṣaḥ"], "e": "So do what must be done, always, without attachment. Acting without attachment, a person reaches the highest."}, {"ref": "3.21", "img": "img/3.21.jpg", "ch": 3, "h": "Others follow", "d": ["यद्यदाचरति श्रेष्ठस्तत्तदेवेतरो जनः।", "स यत्प्रमाणं कुरुते लोकस्तदनुवर्तते॥"], "t": ["yad yad ācarati śreṣṭhas tat tad evetaro janaḥ", "sa yat pramāṇaṁ kurute lokas tad anuvartate"], "e": "Whatever a great person does, others do too. Whatever standard such a person sets, the world follows."}, {"ref": "3.25", "img": "img/3.25.jpg", "ch": 3, "h": "For the world's sake", "d": ["सक्ताः कर्मण्यविद्वांसो यथा कुर्वन्ति भारत।", "कुर्याद्विद्वांस्तथासक्तश्िचकीर्षुर्लोकसंग्रहम्॥"], "t": ["saktāḥ karmaṇyavidvāṁso yathā kurvanti bhārata", "kuryād vidvāṁs tathāsaktaś cikīrṣur loka-saṅgraham"], "e": "As the ignorant act, attached to their work, so the wise should act, unattached, wishing to hold the world together."}, {"ref": "3.27", "img": "img/3.27.jpg", "ch": 3, "h": "Who really acts", "d": ["प्रकृतेः क्रियमाणानि गुणैः कर्माणि सर्वशः।", "अहङ्कारविमूढात्मा कर्ताऽहमिति मन्यते॥"], "t": ["prakṛteḥ kriyamāṇāni guṇaiḥ karmāṇi sarvaśaḥ", "ahankāra-vimūḍhātmā kartāham iti manyate"], "e": "All actions are done by the qualities of nature. Confused by the sense of ‘I’, a person thinks, ‘I am the doer.’"}, {"ref": "3.30", "img": "img/3.30.jpg", "ch": 3, "h": "Without fever", "d": ["मयि सर्वाणि कर्माणि संन्यस्याध्यात्मचेतसा।", "निराशीर्निर्ममो भूत्वा युध्यस्व विगतज्वरः॥"], "t": ["mayi sarvāṇi karmāṇi sannyasyādhyātma-cetasā", "nirāśīr nirmamo bhūtvā yudhyasva vigata-jvaraḥ"], "e": "Surrender all your actions to me, with your mind resting in the self. Free of hope, free of ‘mine’, free of fever, fight."}, {"ref": "3.34", "img": "img/3.34.jpg", "ch": 3, "h": "Robbers on the road", "d": ["इन्द्रियस्येन्द्रियस्यार्थे रागद्वेषौ व्यवस्थितौ।", "तयोर्न वशमागच्छेत्तौ ह्यस्य परिपन्थिनौ॥"], "t": ["indriyasyendriyasyārthe rāga-dveṣau vyavasthitau", "tayor na vaśam āgacchet tau hyasya paripanthinau"], "e": "Attraction and aversion sit in every sense, waiting for their object. Do not fall under the sway of either; they are robbers on your road."}, {"ref": "3.35", "img": "img/3.35.jpg", "ch": 3, "h": "Your own path, imperfectly", "d": ["श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात्।", "स्वधर्मे निधनं श्रेयः परधर्मो भयावहः॥"], "t": ["śreyān swa-dharmo viguṇaḥ para-dharmāt sv-anuṣṭhitāt", "swa-dharme nidhanaṁ śreyaḥ para-dharmo bhayāvahaḥ"], "e": "Better your own dharma done imperfectly than another's done well. Better to die in your own dharma; another's is full of fear."}, {"ref": "3.37", "img": "img/3.37.jpg", "ch": 3, "h": "The enemy has a name", "d": ["काम एष क्रोध एष रजोगुणसमुद्भवः।", "महाशनो महापाप्मा विद्ध्येनमिह वैरिणम्॥"], "t": ["kāma eṣa krodha eṣa rajo-guṇa-samudbhavaḥ", "mahāśano mahā-pāpmā viddhyenam iha vairiṇam"], "e": "It is desire, it is anger, born of the quality of passion, all-devouring, greatly harmful. Know this to be the enemy here."}, {"ref": "3.38", "img": "img/3.38.jpg", "ch": 3, "h": "Smoke, dust, womb", "d": ["धूमेनाव्रियते वह्निर्यथाऽऽदर्शो मलेन च।", "यथोल्बेनावृतो गर्भस्तथा तेनेदमावृतम्॥"], "t": ["dhūmenāvriyate vahnir yathādarśo malena ca", "yatholbenāvṛto garbhas tathā tenedam āvṛtam"], "e": "As fire is covered by smoke, a mirror by dust, and the unborn by the womb, so is knowledge covered by this."}, {"ref": "3.42", "img": "img/3.42.jpg", "ch": 3, "h": "The chain of command", "d": ["इन्द्रियाणि पराण्याहुरिन्द्रियेभ्यः परं मनः।", "मनसस्तु परा बुद्धिर्यो बुद्धेः परतस्तु सः॥"], "t": ["indriyāṇi parāṇyāhur indriyebhyaḥ paraṁ manaḥ", "manasas tu parā buddhir yo buddheḥ paratas tu saḥ"], "e": "The senses are high, they say; higher than the senses is the mind; higher than the mind is understanding; and higher than understanding is that one."}, {"ref": "4.7", "img": "img/4.7.jpg", "ch": 4, "h": "Whenever dharma fails", "d": ["यदा यदा हि धर्मस्य ग्लानिर्भवति भारत।", "अभ्युत्थानमधर्मस्य तदाऽऽत्मानं सृजाम्यहम्॥"], "t": ["yadā yadā hi dharmasya glānir bhavati bhārata", "abhyutthānam adharmasya tadātmānaṁ sṛjāmyaham"], "e": "Whenever dharma declines and its opposite rises, Arjuna, I bring myself forth."}, {"ref": "4.8", "img": "img/4.8.jpg", "ch": 4, "h": "Age after age", "d": ["परित्राणाय साधूनां विनाशाय च दुष्कृताम्।", "धर्मसंस्थापनार्थाय संभवामि युगे युगे॥"], "t": ["paritrāṇāya sādhūnāṁ vināśāya ca duṣkṛtām", "dharma-saṁsthāpanārthāya sambhavāmi yuge yuge"], "e": "To protect the good, to destroy the wicked, and to establish dharma, I come into being age after age."}, {"ref": "4.11", "img": "img/4.11.jpg", "ch": 4, "h": "However you come to me", "d": ["ये यथा मां प्रपद्यन्ते तांस्तथैव भजाम्यहम्।", "मम वर्त्मानुवर्तन्ते मनुष्याः पार्थ सर्वशः॥"], "t": ["ye yathā māṁ prapadyante tāṁs tathaiva bhajāmyaham", "mama vartmānuvartante manuṣyāḥ pārtha sarvaśaḥ"], "e": "However people approach me, I meet them in that same way. Everyone, Arjuna, follows my path in every way."}, {"ref": "4.18", "img": "img/4.18.jpg", "ch": 4, "h": "Stillness inside action", "d": ["कर्मण्यकर्म यः पश्येदकर्मणि च कर्म यः।", "स बुद्धिमान् मनुष्येषु स युक्तः कृत्स्नकर्मकृत्॥"], "t": ["karmaṇyakarma yaḥ paśyed akarmaṇi ca karma yaḥ", "sa buddhimān manuṣyeṣu sa yuktaḥ kṛtsna-karma-kṛt"], "e": "The one who sees inaction in action and action in inaction is wise among people; that one is disciplined, and has done all there is to do."}, {"ref": "4.22", "img": "img/4.22.jpg", "ch": 4, "h": "Content with what comes", "d": ["यदृच्छालाभसन्तुष्टो द्वन्द्वातीतो विमत्सरः।", "समः सिद्धावसिद्धौ च कृत्वापि न निबध्यते॥"], "t": ["yadṛcchā-lābha-santuṣṭo dvandvātīto vimatsaraḥ", "samaḥ siddhāvasiddhau ca kṛtvāpi na nibadhyate"], "e": "Content with whatever comes unsought, beyond the pairs of opposites, free of envy, the same in success and failure, such a person acts and is not bound."}, {"ref": "4.33", "img": "img/4.33.jpg", "ch": 4, "h": "All action ends in knowledge", "d": ["श्रेयान्द्रव्यमयाद्यज्ञाज्ज्ञानयज्ञः परन्तप।", "सर्वं कर्माखिलं पार्थ ज्ञाने परिसमाप्यते॥"], "t": ["śreyān dravya-mayād yajñāj jñāna-yajñaḥ parantapa", "sarvaṁ karmākhilaṁ pārtha jñāne parisamāpyate"], "e": "Better than any offering of things is the offering of knowledge, Arjuna. All action, without remainder, ends in knowledge."}, {"ref": "4.34", "img": "img/4.34.jpg", "ch": 4, "h": "How to learn", "d": ["तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया।", "उपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिनः॥"], "t": ["tad viddhi praṇipātena paripraśnena sevayā", "upadekṣyanti te jñānaṁ jñāninas tattva-darśinaḥ"], "e": "Learn this by bowing, by asking questions, by serving. The wise who have seen the truth will teach it to you."}, {"ref": "4.36", "img": "img/4.36.jpg", "ch": 4, "h": "The raft", "d": ["अपि चेदसि पापेभ्यः सर्वेभ्यः पापकृत्तमः।", "सर्वं ज्ञानप्लवेनैव वृजिनं सन्तरिष्यसि॥"], "t": ["api ced asi pāpebhyaḥ sarvebhyaḥ pāpa-kṛt-tamaḥ", "sarvaṁ jñāna-plavenaiva vṛjinaṁ santariṣyasi"], "e": "Even if you were the worst of all wrongdoers, you would cross over all wrong by the raft of knowledge alone."}, {"ref": "4.37", "img": "img/4.37.jpg", "ch": 4, "h": "Fire", "d": ["यथैधांसि समिद्धोऽग्निर्भस्मसात्कुरुतेऽर्जुन।", "ज्ञानाग्निः सर्वकर्माणि भस्मसात्कुरुते तथा॥"], "t": ["yathaidhāṁsi samiddho ’gnir bhasma-sāt kurute ’rjuna", "jñānāgniḥ sarva-karmāṇi bhasma-sāt kurute tathā"], "e": "As a kindled fire turns its fuel to ash, Arjuna, so the fire of knowledge turns all actions to ash."}, {"ref": "4.38", "img": "img/4.38.jpg", "ch": 4, "h": "It finds you in time", "d": ["न हि ज्ञानेन सदृशं पवित्रमिह विद्यते।", "तत्स्वयं योगसंसिद्धः कालेनात्मनि विन्दति॥"], "t": ["na hi jñānena sadṛśaṁ pavitramiha vidyate", "tatsvayaṁ yogasaṁsiddhaḥ kālenātmani vindati"], "e": "Nothing in this world purifies like knowledge. The one perfected in practice finds it, in time, within the self."}, {"ref": "4.39", "img": "img/4.39.jpg", "ch": 4, "h": "Without delay", "d": ["श्रद्धावाँल्लभते ज्ञानं तत्परः संयतेन्द्रियः।", "ज्ञानं लब्ध्वा परां शान्तिमचिरेणाधिगच्छति॥"], "t": ["śraddhāvān labhate jñānaṁ tat-paraḥ saṁyatendriyaḥ", "jñānaṁ labdhvā parāṁ śāntim acireṇādhigacchati"], "e": "The one with faith, intent on it, with senses restrained, gains knowledge. Having gained it, that person comes without delay to the highest peace."}, {"ref": "4.40", "img": "img/4.40.jpg", "ch": 4, "h": "The doubter", "d": ["अज्ञश्चाश्रद्दधानश्च संशयात्मा विनश्यति।", "नायं लोकोऽस्ति न परो न सुखं संशयात्मनः॥"], "t": ["ajñaś cāśraddadhānaś ca saṁśayātmā vinaśyati", "nāyaṁ loko ’sti na paro na sukhaṁ saṁśayātmanaḥ"], "e": "The ignorant, the faithless, the doubting are lost. For the doubting self there is neither this world nor the next, nor any happiness."}, {"ref": "5.3", "img": "img/5.3.jpg", "ch": 5, "h": "The real renouncer", "d": ["ज्ञेयः स नित्यसंन्यासी यो न द्वेष्टि न काङ्क्षति।", "निर्द्वन्द्वो हि महाबाहो सुखं बन्धात्प्रमुच्यते॥"], "t": ["jñeyaḥ sa nitya-sannyāsī yo na dveṣṭi na kāṅkṣati", "nirdvandvo hi mahā-bāho sukhaṁ bandhāt pramucyate"], "e": "Know as a true renouncer the one who neither hates nor desires. Beyond the pairs of opposites, Arjuna, that person is easily released from bondage."}, {"ref": "5.8", "img": "img/5.8.jpg", "ch": 5, "h": "I do nothing at all", "d": ["नैव किंचित्करोमीति युक्तो मन्येत तत्त्ववित्।", "पश्यन् शृण्वन्स्पृशञ्जिघ्रन्नश्नन्गच्छन्स्वपन् श्वसन्॥"], "t": ["naiva kiñcit karomīti yukto manyeta tattva-vit", "paśyañ śṛṇvan spṛśañ jighrann aśnan gacchan svapañ śvasan"], "e": "‘I do nothing at all,’ thinks the one who knows the truth, even while seeing, hearing, touching, smelling, eating, walking, sleeping, breathing."}, {"ref": "5.10", "img": "img/5.10.jpg", "ch": 5, "h": "The lotus leaf", "d": ["ब्रह्मण्याधाय कर्माणि सङ्गं त्यक्त्वा करोति यः।", "लिप्यते न स पापेन पद्मपत्रमिवाम्भसा॥"], "t": ["brahmaṇyādhāya karmāṇi saṅgaṁ tyaktvā karoti yaḥ", "lipyate na sa pāpena padma-patram ivāmbhasā"], "e": "The one who acts giving all actions to Brahman, with attachment gone, is not touched by wrong, as a lotus leaf is not wet by water."}, {"ref": "5.12", "img": "img/5.12.jpg", "ch": 5, "h": "Peace, or the knot", "d": ["युक्तः कर्मफलं त्यक्त्वा शान्तिमाप्नोति नैष्ठिकीम्।", "अयुक्तः कामकारेण फले सक्तो निबध्यते॥"], "t": ["yuktaḥ karma-phalaṁ tyaktvā śāntim āpnoti naiṣṭhikīm", "ayuktaḥ kāma-kāreṇa phale sakto nibadhyate"], "e": "The disciplined person gives up the fruit of action and reaches lasting peace. The undisciplined, driven by desire, attached to the fruit, is bound."}, {"ref": "5.18", "img": "img/5.18.jpg", "ch": 5, "h": "The same gaze", "d": ["विद्याविनयसंपन्ने ब्राह्मणे गवि हस्तिनि।", "शुनि चैव श्वपाके च पण्डिताः समदर्शिनः॥"], "t": ["vidyā-vinaya-sampanne brāhmaṇe gavi hastini", "śuni caiva śva-pāke ca paṇḍitāḥ sama-darśinaḥ"], "e": "The wise see the same in a learned and humble brahmin, in a cow, in an elephant, in a dog, and in an outcaste."}, {"ref": "5.19", "img": "img/5.19.jpg", "ch": 5, "h": "Here, in this life", "d": ["इहैव तैर्जितः सर्गो येषां साम्ये स्थितं मनः।", "निर्दोषं हि समं ब्रह्म तस्माद्ब्रह्मणि ते स्थिताः॥"], "t": ["ihaiva tair jitaḥ sargo yeṣāṁ sāmye sthitaṁ manaḥ", "nirdoṣaṁ hi samaṁ brahma tasmād brahmaṇi te sthitāḥ"], "e": "Those whose minds rest in sameness have conquered birth here, in this very life. Brahman is flawless and the same everywhere; so they stand in Brahman."}, {"ref": "5.20", "img": "img/5.20.jpg", "ch": 5, "h": "Neither thrilled nor shaken", "d": ["न प्रहृष्येत्प्रियं प्राप्य नोद्विजेत्प्राप्य चाप्रियम्।", "स्थिरबुद्धिरसम्मूढो ब्रह्मविद्ब्रह्मणि स्थितः॥"], "t": ["na prahṛṣyet priyaṁ prāpya nodvijet prāpya cāpriyam", "sthira-buddhir asammūḍho brahma-vid brahmaṇi sthitaḥ"], "e": "Not elated on gaining what is pleasant, not shaken on meeting what is not, steady, unconfused, the knower of Brahman stands in Brahman."}, {"ref": "5.22", "img": "img/5.22.jpg", "ch": 5, "h": "Start dates and end dates", "d": ["ये हि संस्पर्शजा भोगा दुःखयोनय एव ते।", "आद्यन्तवन्तः कौन्तेय न तेषु रमते बुधः॥"], "t": ["ye hi saṁsparśa-jā bhogā duḥkha-yonaya eva te", "ādyantavantaḥ kaunteya na teṣu ramate budhaḥ"], "e": "Pleasures born of contact are wombs of pain. They have a beginning and an end, Arjuna; the wise take no delight in them."}, {"ref": "5.23", "img": "img/5.23.jpg", "ch": 5, "h": "That one is happy", "d": ["शक्नोतीहैव यः सोढुं प्राक्शरीरविमोक्षणात्।", "कामक्रोधोद्भवं वेगं स युक्तः स सुखी नरः॥"], "t": ["śaknotīhaiva yaḥ soḍhuṁ prāk śarīra-vimokṣaṇāt", "kāma-krodhodbhavaṁ vegaṁ sa yuktaḥ sa sukhī naraḥ"], "e": "The one who, before leaving the body, can withstand the surge of desire and anger, that one is disciplined, that one is happy."}, {"ref": "5.24", "img": "img/5.24.jpg", "ch": 5, "h": "Light within", "d": ["योऽन्तःसुखोऽन्तरारामस्तथान्तर्ज्योतिरेव यः।", "स योगी ब्रह्मनिर्वाणं ब्रह्मभूतोऽधिगच्छति॥"], "t": ["yo ’ntaḥ-sukho ’ntar-ārāmas tathāntar-jyotir eva yaḥ", "sa yogī brahma-nirvāṇaṁ brahma-bhūto ’dhigacchati"], "e": "The one whose happiness is within, whose rest is within, whose light is within, that one is disciplined and reaches the freedom of Brahman."}, {"ref": "6.5", "img": "img/6.5.jpg", "ch": 6, "h": "Lift yourself", "d": ["उद्धरेदात्मनाऽऽत्मानं नात्मानमवसादयेत्।", "आत्मैव ह्यात्मनो बन्धुरात्मैव रिपुरात्मनः॥"], "t": ["uddhared ātmanātmānaṁ nātmānam avasādayet", "ātmaiva hyātmano bandhur ātmaiva ripur ātmanaḥ"], "e": "Lift yourself by yourself; do not let yourself sink. The self alone is the self's friend, and the self alone its enemy."}, {"ref": "6.17", "img": "img/6.17.jpg", "ch": 6, "h": "Measure", "d": ["युक्ताहारविहारस्य युक्तचेष्टस्य कर्मसु।", "युक्तस्वप्नावबोधस्य योगो भवति दुःखहा॥"], "t": ["yuktāhāra-vihārasya yukta-ceṣṭasya karmasu", "yukta-svapnāvabodhasya yogo bhavati duḥkha-hā"], "e": "For the one who is measured in food and rest, measured in work, measured in sleep and waking, yoga becomes the destroyer of sorrow."}, {"ref": "6.19", "img": "img/6.19.jpg", "ch": 6, "h": "A lamp in a windless place", "d": ["यथा दीपो निवातस्थो नेङ्गते सोपमा स्मृता।", "योगिनो यतचित्तस्य युञ्जतो योगमात्मनः॥"], "t": ["yathā dīpo nivāta-stho neṅgate sopamā smṛtā", "yogino yata-cittasya yuñjato yogam ātmanaḥ"], "e": "As a lamp in a windless place does not flicker, so is the disciplined mind of the one who practises union with the self."}, {"ref": "6.22", "img": "img/6.22.jpg", "ch": 6, "h": "Ground no sorrow can shake", "d": ["यं लब्ध्वा चापरं लाभं मन्यते नाधिकं ततः।", "यस्मिन्स्थितो न दुःखेन गुरुणापि विचाल्यते॥"], "t": ["yaṁ labdhvā cāparaṁ lābhaṁ manyate nādhikaṁ tataḥ", "yasmin sthito na duḥkhena guruṇāpi vicālyate"], "e": "Having gained it, one knows there is no greater gain. Standing in it, one is not shaken even by the heaviest sorrow."}, {"ref": "6.23", "img": "img/6.23.jpg", "ch": 6, "h": "Unyoked from pain", "d": ["तं विद्याद् दुःखसंयोगवियोगं योगसंज्ञितम्।", "स निश्चयेन योक्तव्यो योगोऽनिर्विण्णचेतसा॥"], "t": ["taṁ vidyād duḥkha-saṁyoga-viyogaṁ yogasaṅjñitam", "sa niścayena yoktavyo yogo ’nirviṇṇa-cetasā"], "e": "Know this unyoking from the yoke of pain to be yoga. It should be practised with resolve, with a heart that does not despair."}, {"ref": "6.26", "img": "img/6.26.jpg", "ch": 6, "h": "Bring it back", "d": ["यतो यतो निश्चरति मनश्चञ्चलमस्थिरम्।", "ततस्ततो नियम्यैतदात्मन्येव वशं नयेत्॥"], "t": ["yato yato niścarati manaś cañcalam asthiram", "tatas tato niyamyaitad ātmanyeva vaśaṁ nayet"], "e": "Wherever the restless, unsteady mind wanders, from there draw it back and bring it under the self's rule."}, {"ref": "6.29", "img": "img/6.29.jpg", "ch": 6, "h": "The self in all beings", "d": ["सर्वभूतस्थमात्मानं सर्वभूतानि चात्मनि।", "ईक्षते योगयुक्तात्मा सर्वत्र समदर्शनः॥"], "t": ["sarva-bhūta-stham ātmānaṁ sarva-bhūtāni cātmani", "īkṣate yoga-yuktātmā sarvatra sama-darśanaḥ"], "e": "The one whose self is joined in yoga sees the self in all beings and all beings in the self, seeing the same everywhere."}, {"ref": "6.30", "img": "img/6.30.jpg", "ch": 6, "h": "Never lost", "d": ["यो मां पश्यति सर्वत्र सर्वं च मयि पश्यति।", "तस्याहं न प्रणश्यामि स च मे न प्रणश्यति॥"], "t": ["yo māṁ paśyati sarvatra sarvaṁ ca mayi paśyati", "tasyāhaṁ na praṇaśyāmi sa ca me na praṇaśyati"], "e": "The one who sees me everywhere and sees everything in me, I am never lost to that person, and that person is never lost to me."}, {"ref": "6.32", "img": "img/6.32.jpg", "ch": 6, "h": "By one's own measure", "d": ["आत्मौपम्येन सर्वत्र समं पश्यति योऽर्जुन।", "सुखं वा यदि वा दुःखं सः योगी परमो मतः॥"], "t": ["ātmaupamyena sarvatra samaṁ paśyati yo ’rjuna", "sukhaṁ vā yadi vā duḥkhaṁ sa yogī paramo mataḥ"], "e": "The one who sees everything by the measure of the self, Arjuna, in pleasure or in pain, is held to be the highest yogi."}, {"ref": "6.34–35", "img": "img/6.34-35.jpg", "ch": 6, "h": "The mind is wind", "d": ["चञ्चलं हि मनः कृष्ण प्रमाथि बलवद्दृढम्।", "तस्याहं निग्रहं मन्ये वायोरिव सुदुष्करम्॥", "असंशयं महाबाहो मनो दुर्निग्रहं चलं।", "अभ्यासेन तु कौन्तेय वैराग्येण च गृह्यते॥"], "t": ["cañcalaṁ hi manaḥ kṛṣṇa pramāthi balavad dṛḍham", "tasyāhaṁ nigrahaṁ manye vāyor iva su-duṣkaram", "asaṁśayaṁ mahā-bāho mano durnigrahaṁ calam", "abhyāsena tu kaunteya vairāgyeṇa ca gṛhyate"], "e": "The mind is restless, Krishna, turbulent, strong and stubborn. Holding it seems to me as hard as holding the wind. — Without doubt, Arjuna, the mind is restless and hard to hold. But with practice and dispassion, it is held."}, {"ref": "6.40", "img": "img/6.40.jpg", "ch": 6, "h": "No good end is bad", "d": ["पार्थ नैवेह नामुत्र विनाशस्तस्य विद्यते।", "नहि कल्याणकृत्कश्िचद्दुर्गतिं तात गच्छति॥"], "t": ["pārtha naiveha nāmutra vināśas tasya vidyate", "na hi kalyāṇa-kṛt kaścid durgatiṁ tāta gacchati"], "e": "Arjuna, neither here nor hereafter is such a person lost. No one who does good, my friend, ever comes to a bad end."}, {"ref": "6.45", "img": "img/6.45.jpg", "ch": 6, "h": "The long game", "d": ["प्रयत्नाद्यतमानस्तु योगी संशुद्धकिल्बिषः।", "अनेकजन्मसंसिद्धस्ततो याति परां गतिम्॥"], "t": ["prayatnād yatamānas tu yogī saṁśuddha-kilbiṣaḥ", "aneka-janma-saṁsiddhas tato yāti parāṁ gatim"], "e": "The yogi who strives with effort, cleansed of wrong, perfected over many births, then reaches the highest goal."}, {"ref": "6.47", "img": "img/6.47.jpg", "ch": 6, "h": "The one who trusts", "d": ["योगिनामपि सर्वेषां मद्गतेनान्तरात्मना।", "श्रद्धावान्भजते यो मां स मे युक्ततमो मतः॥"], "t": ["yoginām api sarveṣāṁ mad-gatenāntar-ātmanā", "śraddhāvān bhajate yo māṁ sa me yuktatamo mataḥ"], "e": "Of all yogis, the one who has gone to me with the inner self, and worships me with trust, I hold to be the most joined to me."}, {"ref": "7.3", "img": "img/7.3.jpg", "ch": 7, "h": "Among thousands, one", "d": ["मनुष्याणां सहस्रेषु कश्िचद्यतति सिद्धये।", "यततामपि सिद्धानां कश्िचन्मां वेत्ति तत्त्वतः॥"], "t": ["manuṣyāṇāṁ sahasreṣu kaścid yatati siddhaye", "yatatām api siddhānāṁ kaścin māṁ vetti tattvataḥ"], "e": "Among thousands of people, one perhaps strives for perfection. Among those who strive and succeed, one perhaps knows me as I am."}, {"ref": "7.7", "img": "img/7.7.jpg", "ch": 7, "h": "Pearls on a thread", "d": ["मत्तः परतरं नान्यत्किञ्चिदस्ति धनञ्जय।", "मयि सर्वमिदं प्रोतं सूत्रे मणिगणा इव॥"], "t": ["mattaḥ parataraṁ nānyat kiñcid asti dhanañjaya", "mayi sarvam idaṁ protaṁ sūtre maṇi-gaṇā iva"], "e": "There is nothing higher than me, Arjuna. All this is strung on me, like pearls on a thread."}, {"ref": "7.8", "img": "img/7.8.jpg", "ch": 7, "h": "The taste in water", "d": ["रसोऽहमप्सु कौन्तेय प्रभास्मि शशिसूर्ययोः।", "प्रणवः सर्ववेदेषु शब्दः खे पौरुषं नृषु॥"], "t": ["raso ’ham apsu kaunteya prabhāsmi śaśi-sūryayoḥ", "praṇavaḥ sarva-vedeṣu śabdaḥ khe pauruṣaṁ nṛṣu"], "e": "I am the taste in water, Arjuna, the light in the moon and the sun, the sacred syllable in all the Vedas, the sound in space, the strength in people."}, {"ref": "7.14", "img": "img/7.14.jpg", "ch": 7, "h": "Hard to cross", "d": ["दैवी ह्येषा गुणमयी मम माया दुरत्यया।", "मामेव ये प्रपद्यन्ते मायामेतां तरन्ति ते॥"], "t": ["daivī hyeṣā guṇa-mayī mama māyā duratyayā", "mām eva ye prapadyante māyām etāṁ taranti te"], "e": "This divine illusion of mine, made of the three qualities, is hard to cross. Those who take refuge in me alone cross over it."}, {"ref": "7.16", "img": "img/7.16.jpg", "ch": 7, "h": "The distressed are named first", "d": ["चतुर्विधा भजन्ते मां जनाः सुकृतिनोऽर्जुन।", "आर्तो जिज्ञासुरर्थार्थी ज्ञानी च भरतर्षभ॥"], "t": ["catur-vidhā bhajante māṁ janāḥ sukṛtino ’rjuna", "ārto jijñāsur arthārthī jñānī ca bharatarṣabha"], "e": "Four kinds of good people worship me, Arjuna: the distressed, the seeker of knowledge, the seeker of wealth, and the one who knows."}, {"ref": "7.19", "img": "img/7.19.jpg", "ch": 7, "h": "After many births", "d": ["बहूनां जन्मनामन्ते ज्ञानवान्मां प्रपद्यते।", "वासुदेवः सर्वमिति स महात्मा सुदुर्लभः॥"], "t": ["bahūnāṁ janmanām ante jñānavān māṁ prapadyate", "vāsudevaḥ sarvam iti sa mahātmā su-durlabhaḥ"], "e": "At the end of many births, the one who knows comes to me: ‘Vasudeva is everything.’ Such a great soul is very hard to find."}, {"ref": "8.5", "img": "img/8.5.jpg", "ch": 8, "h": "At the end", "d": ["अन्तकाले च मामेव स्मरन्मुक्त्वा कलेवरम्।", "यः प्रयाति स मद्भावं याति नास्त्यत्र संशयः॥"], "t": ["anta-kāle ca mām eva smaran muktvā kalevaram", "yaḥ prayāti sa mad-bhāvaṁ yāti nāstyatra saṁśayaḥ"], "e": "Whoever leaves the body remembering me alone, at the time of death, comes to my being. Of this there is no doubt."}, {"ref": "8.6", "img": "img/8.6.jpg", "ch": 8, "h": "What you dwell on", "d": ["यं यं वापि स्मरन्भावं त्यजत्यन्ते कलेवरम्।", "तं तमेवैति कौन्तेय सदा तद्भावभावितः॥"], "t": ["yaṁ yaṁ vāpi smaran bhāvaṁ tyajatyante kalevaram", "taṁ tam evaiti kaunteya sadā tad-bhāva-bhāvitaḥ"], "e": "Whatever state of being a person remembers when leaving the body at the end, that is what that person reaches, Arjuna, having always dwelt on it."}, {"ref": "8.7", "img": "img/8.7.jpg", "ch": 8, "h": "Remember, and fight", "d": ["तस्मात्सर्वेषु कालेषु मामनुस्मर युध्य च।", "मय्यर्पितमनोबुद्धिर्मामेवैष्यस्यसंशयम्॥"], "t": ["tasmāt sarveṣu kāleṣu mām anusmara yudhya ca", "mayyarpita-mano-buddhir mām evaiṣyasyasaṁśayam"], "e": "So remember me at all times, and fight. With mind and understanding given to me, you will come to me without doubt."}, {"ref": "8.14", "img": "img/8.14.jpg", "ch": 8, "h": "Easy to reach", "d": ["अनन्यचेताः सततं यो मां स्मरति नित्यशः।", "तस्याहं सुलभः पार्थ नित्ययुक्तस्य योगिनः॥"], "t": ["ananya-cetāḥ satataṁ yo māṁ smarati nityaśaḥ", "tasyāhaṁ sulabhaḥ pārtha nitya-yuktasya yoginaḥ"], "e": "For the one who remembers me constantly, with mind on nothing else, I am easy to reach, Arjuna, for that yogi who is always joined to me."}, {"ref": "9.2", "img": "img/9.2.jpg", "ch": 9, "h": "Pleasant to practise", "d": ["राजविद्या राजगुह्यं पवित्रमिदमुत्तमम्।", "प्रत्यक्षावगमं धर्म्यं सुसुखं कर्तुमव्ययम्॥"], "t": ["rāja-vidyā rāja-guhyaṁ pavitram idam uttamam", "pratyakṣāvagamaṁ dharmyaṁ su-sukhaṁ kartum avyayam"], "e": "This is the king of knowledge, the king of secrets, the highest purifier. It is known directly, it accords with dharma, it is pleasant to practise, and it does not perish."}, {"ref": "9.22", "img": "img/9.22.jpg", "ch": 9, "h": "I carry what they need", "d": ["अनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते।", "तेषां नित्याभियुक्तानां योगक्षेमं वहाम्यहम्॥"], "t": ["ananyāś cintayanto māṁ ye janāḥ paryupāsate", "teṣāṁ nityābhiyuktānāṁ yoga-kṣemaṁ vahāmyaham"], "e": "Those who think of me and nothing else, who worship me always joined to me, I bring them what they lack and I guard what they have."}, {"ref": "9.26", "img": "img/9.26.jpg", "ch": 9, "h": "A leaf, a flower", "d": ["पत्रं पुष्पं फलं तोयं यो मे भक्त्या प्रयच्छति।", "तदहं भक्त्युपहृतमश्नामि प्रयतात्मनः॥"], "t": ["patraṁ puṣpaṁ phalaṁ toyaṁ yo me bhaktyā prayacchati", "tadahaṁ bhaktyupahṛtam aśnāmi prayatātmanaḥ"], "e": "Whoever offers me with devotion a leaf, a flower, a fruit, or water, that offering of love from a pure heart I accept."}, {"ref": "9.27", "img": "img/9.27.jpg", "ch": 9, "h": "Make it an offering", "d": ["यत्करोषि यदश्नासि यज्जुहोषि ददासि यत्।", "यत्तपस्यसि कौन्तेय तत्कुरुष्व मदर्पणम्॥"], "t": ["yat karoṣi yad aśnāsi yaj juhoṣi dadāsi yat", "yat tapasyasi kaunteya tat kuruṣva mad-arpaṇam"], "e": "Whatever you do, whatever you eat, whatever you offer, whatever you give, whatever austerity you practise, Arjuna, do it as an offering to me."}, {"ref": "9.29", "img": "img/9.29.jpg", "ch": 9, "h": "None hated, none favoured", "d": ["समोऽहं सर्वभूतेषु न मे द्वेष्योऽस्ति न प्रियः।", "ये भजन्ति तु मां भक्त्या मयि ते तेषु चाप्यहम्॥"], "t": ["samo ’haṁ sarva-bhūteṣu na me dveṣyo ’sti na priyaḥ", "ye bhajanti tu māṁ bhaktyā mayi te teṣu cāpyaham"], "e": "I am the same to all beings; none is hated by me and none is dear. But those who worship me with devotion are in me, and I am in them."}, {"ref": "9.30", "img": "img/9.30.jpg", "ch": 9, "h": "Even the worst", "d": ["अपि चेत्सुदुराचारो भजते मामनन्यभाक्।", "साधुरेव स मन्तव्यः सम्यग्व्यवसितो हि सः॥"], "t": ["api cet su-durācāro bhajate mām ananya-bhāk", "sādhur eva sa mantavyaḥ samyag vyavasito hi saḥ"], "e": "Even if someone of very bad conduct worships me with undivided devotion, that person should be counted good, for the resolve is right."}, {"ref": "9.31", "img": "img/9.31.jpg", "ch": 9, "h": "A promise with your name on it", "d": ["क्षिप्रं भवति धर्मात्मा शश्वच्छान्तिं निगच्छति।", "कौन्तेय प्रतिजानीहि न मे भक्तः प्रणश्यति॥"], "t": ["kṣipraṁ bhavati dharmātmā śaśvac-chāntiṁ nigacchati", "kaunteya pratijānīhi na me bhaktaḥ praṇaśyati"], "e": "Quickly that person becomes righteous and reaches lasting peace. Arjuna, know this for certain: my devotee never perishes."}, {"ref": "9.34", "img": "img/9.34.jpg", "ch": 9, "h": "Four steps", "d": ["मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु।", "मामेवैष्यसि युक्त्वैवमात्मानं मत्परायणः॥"], "t": ["man-manā bhava mad-bhakto mad-yājī māṁ namaskuru", "mām evaiṣyasi yuktvaivam ātmānaṁ mat-parāyaṇaḥ"], "e": "Fix your mind on me, be devoted to me, offer to me, bow to me. Joined to me this way, with me as your highest aim, you will come to me."}, {"ref": "10.9", "img": "img/10.9.jpg", "ch": 10, "h": "Telling each other", "d": ["मच्चित्ता मद्गतप्राणा बोधयन्तः परस्परम्।", "कथयन्तश्च मां नित्यं तुष्यन्ति च रमन्ति च॥"], "t": ["mac-cittā mad-gata-prāṇā bodhayantaḥ parasparam", "kathayantaś ca māṁ nityaṁ tuṣyanti ca ramanti ca"], "e": "With their minds in me, their lives given to me, enlightening one another and always speaking of me, they are content and they rejoice."}, {"ref": "10.10", "img": "img/10.10.jpg", "ch": 10, "h": "He writes the syllabus", "d": ["तेषां सततयुक्तानां भजतां प्रीतिपूर्वकम्।", "ददामि बुद्धियोगं तं येन मामुपयान्ति ते॥"], "t": ["teṣāṁ satata-yuktānāṁ bhajatāṁ prīti-pūrvakam", "dadāmi buddhi-yogaṁ taṁ yena mām upayānti te"], "e": "To those who are always joined to me and worship me with love, I give the understanding by which they come to me."}, {"ref": "10.11", "img": "img/10.11.jpg", "ch": 10, "h": "The lamp", "d": ["तेषामेवानुकम्पार्थमहमज्ञानजं तमः।", "नाशयाम्यात्मभावस्थो ज्ञानदीपेन भास्वता॥"], "t": ["teṣām evānukampārtham aham ajñāna-jaṁ tamaḥ", "nāśayāmyātma-bhāva-stho jñāna-dīpena bhāsvatā"], "e": "Out of compassion for them, dwelling in their hearts, I destroy the darkness born of ignorance with the shining lamp of knowledge."}, {"ref": "10.20", "img": "img/10.20.jpg", "ch": 10, "h": "Seated in every heart", "d": ["अहमात्मा गुडाकेश सर्वभूताशयस्थितः।", "अहमादिश्च मध्यं च भूतानामन्त एव च॥"], "t": ["aham ātmā guḍākeśa sarva-bhūtāśaya-sthitaḥ", "aham ādiś ca madhyaṁ ca bhūtānām anta eva ca"], "e": "I am the self, Arjuna, seated in the heart of every being. I am the beginning, the middle, and the end of all beings."}, {"ref": "10.41", "img": "img/10.41.jpg", "ch": 10, "h": "How to admire", "d": ["यद्यद्विभूतिमत्सत्त्वं श्रीमदूर्जितमेव वा।", "तत्तदेवावगच्छ त्वं मम तेजोंऽशसंभवम्॥"], "t": ["yad yad vibhūtimat sattvaṁ śrīmad ūrjitam eva vā", "tat tad evāvagaccha tvaṁ mama tejo ’ṁśa-sambhavam"], "e": "Whatever is glorious, beautiful or powerful, know that it springs from a spark of my splendour."}, {"ref": "11.55", "img": "img/11.55.jpg", "ch": 11, "h": "The whole vision in one line", "d": ["मत्कर्मकृन्मत्परमो मद्भक्तः सङ्गवर्जितः।", "निर्वैरः सर्वभूतेषु यः स मामेति पाण्डव॥"], "t": ["mat-karma-kṛn mat-paramo mad-bhaktaḥ saṅga-varjitaḥ", "nirvairaḥ sarva-bhūteṣu yaḥ sa mām eti pāṇḍava"], "e": "The one who works for me, holds me as the highest, is devoted to me, free of attachment, and without enmity toward any being, that one comes to me, Arjuna."}, {"ref": "12.8–11", "img": "img/12.8-11.jpg", "ch": 12, "h": "Four doors, none locked", "d": ["मय्येव मन आधत्स्व मयि बुद्धिं निवेशय।", "निवसिष्यसि मय्येव अत ऊर्ध्वं न संशयः॥", "अथ चित्तं समाधातुं न शक्नोषि मयि स्थिरम्।", "अभ्यासयोगेन ततो मामिच्छाप्तुं धनञ्जय॥", "अभ्यासेऽप्यसमर्थोऽसि मत्कर्मपरमो भव।", "मदर्थमपि कर्माणि कुर्वन् सिद्धिमवाप्स्यसि॥", "अथैतदप्यशक्तोऽसि कर्तुं मद्योगमाश्रितः।", "सर्वकर्मफलत्यागं ततः कुरु यतात्मवान्॥"], "t": ["mayy eva mana ādhatsva mayi buddhiṁ niveśaya", "nivasiṣyasi mayy eva ata ūrdhvaṁ na saṁśayaḥ", "atha cittaṁ samādhātuṁ na śaknoṣi mayi sthiram", "abhyāsa-yogena tato mām icchāptuṁ dhanañjaya", "abhyāse ’py asamartho ’si mat-karma-paramo bhava", "mad-artham api karmāṇi kurvan siddhim avāpsyasi", "athaitad apy aśakto ’si kartuṁ mad-yogam āśritaḥ", "sarva-karma-phala-tyāgaṁ tataḥ kuru yatātmavān"], "e": "Fix your mind on me alone, rest your understanding in me, and you will live in me from then on; of this there is no doubt. If you cannot hold your mind steady on me, then seek to reach me through steady practice. If you cannot practise, make my work your highest aim; doing work for my sake, you will reach perfection. If even this is beyond you, then take refuge in my yoga and, with yourself governed, give up the fruits of all action."}, {"ref": "12.13–14", "img": "img/12.13-14.jpg", "ch": 12, "h": "Dear to me", "d": ["अद्वेष्टा सर्वभूतानां मैत्रः करुण एव च।", "निर्ममो निरहङ्कारः समदुःखसुखः क्षमी॥", "सन्तुष्टः सततं योगी यतात्मा दृढनिश्चयः।", "मय्यर्पितमनोबुद्धिर्यो मद्भक्तः स मे प्रियः॥"], "t": ["adveṣṭā sarva-bhūtānāṁ maitraḥ karuṇa eva ca", "nirmamo nirahankāraḥ sama-duḥkha-sukhaḥ kṣamī", "santuṣṭaḥ satataṁ yogī yatātmā dṛḍha-niścayaḥ", "mayy arpita-mano-buddhir yo mad-bhaktaḥ sa me priyaḥ"], "e": "The one who hates no being, who is friendly and compassionate, free of ‘mine’ and ‘I’, the same in pain and pleasure, forgiving, always content, disciplined, firm in resolve, with mind and understanding given to me, that devotee is dear to me."}, {"ref": "12.15", "img": "img/12.15.jpg", "ch": 12, "h": "Not agitated", "d": ["यस्मान्नोद्विजते लोको लोकान्नोद्विजते च यः।", "हर्षामर्षभयोद्वेगैर्मुक्तो यः स च मे प्रियः॥"], "t": ["yasmān nodvijate loko lokān nodvijate ca yaḥ", "harṣāmarṣa-bhayodvegair mukto yaḥ sa ca me priyaḥ"], "e": "The one who does not agitate the world and whom the world does not agitate, who is free of elation, impatience, fear and distress, is dear to me."}, {"ref": "12.18–19", "img": "img/12.18-19.jpg", "ch": 12, "h": "At home nowhere and everywhere", "d": ["समः शत्रौ च मित्रे च तथा मानापमानयोः।", "शीतोष्णसुखदुःखेषु समः सङ्गविवर्जितः॥", "तुल्यनिन्दास्तुतिर्मौनी सन्तुष्टो येनकेनचित्।", "अनिकेतः स्थिरमतिर्भक्ितमान्मे प्रियो नरः॥"], "t": ["samaḥ śatrau ca mitre ca tathā mānāpamānayoḥ", "śītoṣṇa-sukha-duḥkheṣu samaḥ saṅga-vivarjitaḥ", "tulya-nindā-stutir maunī santuṣṭo yena kenacit", "aniketaḥ sthira-matir bhaktimān me priyo naraḥ"], "e": "The same toward enemy and friend, in honour and disgrace, in cold and heat, pleasure and pain, free of attachment; the same in blame and praise, silent, content with whatever comes, without a home, steady of mind, full of devotion: that person is dear to me."}, {"ref": "13.28", "img": "img/13.28.jpg", "ch": 13, "h": "Seeing", "d": ["समं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम्।", "विनश्यत्स्वविनश्यन्तं यः पश्यति स पश्यति॥"], "t": ["samaṁ sarveṣu bhūteṣu tiṣṭhantaṁ parameśvaram", "vinaśyatsv avinaśyantaṁ yaḥ paśyati sa paśyati"], "e": "The one who sees the highest Lord standing the same in all beings, not perishing when they perish, that one truly sees."}, {"ref": "13.29", "img": "img/13.29.jpg", "ch": 13, "h": "Not injuring the self", "d": ["समं पश्यन्हि सर्वत्र समवस्थितमीश्वरम्।", "न हिनस्त्यात्मनाऽऽत्मानं ततो याति परां गतिम्॥"], "t": ["samaṁ paśyan hi sarvatra samavasthitam īśvaram", "na hinasty ātmanātmānaṁ tato yāti parāṁ gatim"], "e": "Seeing the same Lord standing everywhere, a person does not injure the self by the self, and so reaches the highest goal."}, {"ref": "14.26", "img": "img/14.26.jpg", "ch": 14, "h": "The exit door", "d": ["मां च योऽव्यभिचारेण भक्ितयोगेन सेवते।", "स गुणान्समतीत्यैतान् ब्रह्मभूयाय कल्पते॥"], "t": ["māṁ ca yo ’vyabhicāreṇa bhakti-yogena sevate", "sa guṇān samatītyaitān brahma-bhūyāya kalpate"], "e": "The one who serves me with unswerving devotion crosses beyond these three qualities and is fit to become Brahman."}, {"ref": "15.1", "img": "img/15.1.jpg", "ch": 15, "h": "Roots above, branches below", "d": ["ऊर्ध्वमूलमधःशाखमश्वत्थं प्राहुरव्ययम्।", "छन्दांसि यस्य पर्णानि यस्तं वेद स वेदवित्॥"], "t": ["ūrdhva-mūlam adhaḥ-śākham aśvatthaṁ prāhur avyayam", "chandāṁsi yasya parṇāni yas taṁ veda sa veda-vit"], "e": "They speak of an eternal ashvattha tree with its roots above and branches below, whose leaves are the hymns. The one who knows it knows the Vedas."}, {"ref": "15.6", "img": "img/15.6.jpg", "ch": 15, "h": "Where the going ends", "d": ["न तद्भासयते सूर्यो न शशाङ्को न पावकः।", "यद्गत्वा न निवर्तन्ते तद्धाम परमं मम॥"], "t": ["na tad bhāsayate sūryo na śaśāṅko na pāvakaḥ", "yad gatvā na nivartante tad dhāma paramaṁ mama"], "e": "Neither sun nor moon nor fire lights it. Having gone there, no one returns. That is my highest abode."}, {"ref": "15.7", "img": "img/15.7.jpg", "ch": 15, "h": "What you are", "d": ["ममैवांशो जीवलोके जीवभूतः सनातनः।", "मनःषष्ठानीन्द्रियाणि प्रकृतिस्थानि कर्षति॥"], "t": ["mamaivāṁśo jīva-loke jīva-bhūtaḥ sanātanaḥ", "manaḥ-ṣaṣṭhānīndriyāṇi prakṛti-sthāni karṣati"], "e": "A fragment of me, eternal, becomes the living being in this world and draws to itself the mind and the five senses that rest in nature."}, {"ref": "15.15", "img": "img/15.15.jpg", "ch": 15, "h": "Even the forgetting", "d": ["सर्वस्य चाहं हृदि सन्निविष्टो मत्तः स्मृतिर्ज्ञानमपोहनं च।", "वेदैश्च सर्वैरहमेव वेद्यो वेदान्तकृद्वेदविदेव चाहम्॥"], "t": ["sarvasya cāhaṁ hṛdi sanniviṣṭo", "mattaḥ smṛtir jñānam apohanaṁ ca", "vedaiś ca sarvair aham eva vedyo", "vedānta-kṛd veda-vid eva cāham"], "e": "I am seated in the hearts of all. From me come memory, knowledge, and their loss. I am what all the Vedas seek to know; I made the Vedanta, and I am the knower of the Vedas."}, {"ref": "16.21", "img": "img/16.21.jpg", "ch": 16, "h": "Three gates", "d": ["त्रिविधं नरकस्येदं द्वारं नाशनमात्मनः।", "कामः क्रोधस्तथा लोभस्तस्मादेतत्त्रयं त्यजेत्॥"], "t": ["tri-vidhaṁ narakasyedaṁ dvāraṁ nāśanam ātmanaḥ", "kāmaḥ krodhas tathā lobhas tasmād etat trayaṁ tyajet"], "e": "Threefold is the gate of hell that destroys the self: desire, anger and greed. So give up these three."}, {"ref": "17.3", "img": "img/17.3.jpg", "ch": 17, "h": "Made of faith", "d": ["सत्त्वानुरूपा सर्वस्य श्रद्धा भवति भारत।", "श्रद्धामयोऽयं पुरुषो यो यच्छ्रद्धः स एव सः॥"], "t": ["sattvānurūpā sarvasya śraddhā bhavati bhārata", "śraddhā-mayo ‘yaṁ puruṣo yo yac-chraddhaḥ sa eva saḥ"], "e": "Each person's faith follows their nature, Arjuna. A person is made of faith; as the faith is, so is the person."}, {"ref": "18.37–38", "img": "img/18.37-38.jpg", "ch": 18, "h": "Two curves", "d": ["यत्तदग्रे विषमिव परिणामेऽमृतोपमम्।", "तत्सुखं सात्त्विकं प्रोक्तमात्मबुद्धिप्रसादजम्॥", "विषयेन्द्रियसंयोगाद्यत्तदग्रेऽमृतोपमम्।", "परिणामे विषमिव तत्सुखं राजसं स्मृतम्॥"], "t": ["yat tad agre viṣam iva pariṇāme ’mṛtopamam", "tat sukhaṁ sāttvikaṁ proktam ātma-buddhi-prasāda-jam", "viṣayendriya-saṁyogād yat tad agre ’mṛtopamam", "pariṇāme viṣam iva tat sukhaṁ rājasaṁ smṛtam"], "e": "What is like poison at first and like nectar at the end, born of the clarity of self-knowledge, that happiness is called pure. What is like nectar at first, from the senses meeting their objects, and like poison at the end, that happiness is called passionate."}, {"ref": "18.46", "img": "img/18.46.jpg", "ch": 18, "h": "Through your own work", "d": ["यतः प्रवृत्तिर्भूतानां येन सर्वमिदं ततम्।", "स्वकर्मणा तमभ्यर्च्य सिद्धिं विन्दति मानवः॥"], "t": ["yataḥ pravṛttir bhūtānāṁ yena sarvam idaṁ tatam", "sva-karmaṇā tam abhyarcya siddhiṁ vindati mānavaḥ"], "e": "The one from whom all beings arise, by whom all this is pervaded, by worshipping that one through your own work a person finds perfection."}, {"ref": "18.48", "img": "img/18.48.jpg", "ch": 18, "h": "Fire in smoke", "d": ["सहजं कर्म कौन्तेय सदोषमपि न त्यजेत्।", "सर्वारम्भा हि दोषेण धूमेनाग्निरिवावृताः॥"], "t": ["saha-jaṁ karma kaunteya sa-doṣam api na tyajet", "sarvārambhā hi doṣeṇa dhūmenāgnir ivāvṛtāḥ"], "e": "Do not abandon the work you were born to, Arjuna, even if it is flawed. Every undertaking is wrapped in some flaw, as fire is wrapped in smoke."}, {"ref": "18.58", "img": "img/18.58.jpg", "ch": 18, "h": "Every obstacle", "d": ["मच्चित्तः सर्वदुर्गाणि मत्प्रसादात्तरिष्यसि।", "अथ चेत्त्वमहङ्कारान्न श्रोष्यसि विनङ्क्ष्यसि॥"], "t": ["mac-cittaḥ sarva-durgāṇi mat-prasādāt tariṣyasi", "atha cet tvam ahankārān na śroṣyasi vinaṅkṣyasi"], "e": "With your mind on me, you will cross every obstacle by my grace. But if, out of pride, you will not listen, you will be lost."}, {"ref": "18.61", "img": "img/18.61.jpg", "ch": 18, "h": "Mounted on a machine", "d": ["ईश्वरः सर्वभूतानां हृद्देशेऽर्जुन तिष्ठति।", "भ्रामयन्सर्वभूतानि यन्त्रारूढानि मायया॥"], "t": ["īśvaraḥ sarva-bhūtānāṁ hṛd-deśe ‘rjuna tiṣṭhati", "bhrāmayan sarva-bhūtāni yantrārūḍhāni māyayā"], "e": "The Lord dwells in the heart of every being, Arjuna, turning all beings by his power as if they were mounted on a machine."}, {"ref": "18.62", "img": "img/18.62.jpg", "ch": 18, "h": "Refuge with your whole being", "d": ["तमेव शरणं गच्छ सर्वभावेन भारत।", "तत्प्रसादात्परां शान्तिं स्थानं प्राप्स्यसि शाश्वतम्॥"], "t": ["tam eva śaraṇaṁ gaccha sarva-bhāvena bhārata", "tat-prasādāt parāṁ śāntiṁ sthānaṁ prāpsyasi śāśvatam"], "e": "Go to that one alone for refuge, with your whole being, Arjuna. By that grace you will reach the highest peace, the eternal home."}, {"ref": "18.63", "img": "img/18.63.jpg", "ch": 18, "h": "Then do as you choose", "d": ["इति ते ज्ञानमाख्यातं गुह्याद्गुह्यतरं मया।", "विमृश्यैतदशेषेण यथेच्छसि तथा कुरु॥"], "t": ["iti te jñānam ākhyātaṁ guhyād guhyataraṁ mayā", "vimṛśyaitad aśeṣeṇa yathecchasi tathā kuru"], "e": "So I have told you this knowledge, the secret of secrets. Reflect on it fully, and then do as you choose."}, {"ref": "18.66", "img": "img/18.66.jpg", "ch": 18, "h": "Do not grieve", "d": ["सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज।", "अहं त्वा सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः॥"], "t": ["sarva-dharmān parityajya mām ekaṁ śaraṇaṁ vraja", "ahaṁ tvāṁ sarva-pāpebhyo mokṣayiṣyāmi mā śucaḥ"], "e": "Let go of all dharmas and come to me alone for refuge. I will free you from all wrong. Do not grieve."}, {"ref": "18.73", "img": "img/18.73.jpg", "ch": 18, "h": "I stand firm", "d": ["नष्टो मोहः स्मृतिर्लब्धा त्वत्प्रसादान्मयाच्युत।", "स्थितोऽस्मि गतसन्देहः करिष्ये वचनं तव॥"], "t": ["naṣṭo mohaḥ smṛtir labdhā tvat-prasādān mayācyuta", "sthito ‘smi gata-sandehaḥ kariṣye vacanaṁ tava"], "e": "My delusion is gone; I have regained my memory by your grace, Krishna. I stand firm, my doubts dispelled. I will do as you say."}, {"ref": "18.78", "img": "img/18.78.jpg", "ch": 18, "h": "The benediction", "d": ["यत्र योगेश्वरः कृष्णो यत्र पार्थो धनुर्धरः।", "तत्र श्रीर्विजयो भूतिर्ध्रुवा नीतिर्मतिर्मम॥"], "t": ["yatra yogeśvaraḥ kṛṣṇo yatra pārtho dhanur-dharaḥ", "tatra śrīr vijayo bhūtir dhruvā nītir matir mama"], "e": "Where Krishna, the lord of yoga, is, and where Arjuna the archer is, there are fortune, victory, prosperity and sound judgment. So I believe."}];
const $ = id => document.getElementById(id);
let deck = [], current = -1;

function shuffle() {
  deck = DATA.map((_, i) => i);
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  if (deck[deck.length - 1] === current) deck.unshift(deck.pop());
}
function render(i) {
  current = i; const v = DATA[i];
  $('ref').textContent = v.ref;
  $('plate').hidden = !v.img;
  if (v.img) { $('plateimg').src = v.img; $('plateimg').alt = v.h; }
  $('heading').textContent = v.h;
  $('dev').innerHTML = v.d.map(l => `<p>${l}</p>`).join('');
  $('iast').innerHTML = v.t.map(l => `<p>${l}</p>`).join('');
  $('en').textContent = v.e;
  try { history.replaceState(null, '', '#' + v.ref.replace('–', '-')); } catch (e) {}
}
function draw() {
  if (!deck.length) shuffle();
  const next = deck.pop();
  const card = $('card');
  card.classList.add('out');
  const go = () => { render(next); card.classList.remove('out'); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) go(); else setTimeout(go, 250);
}
function fromHash() {
  const m = location.hash.match(/^#(\d+\.\d+(?:-\d+)?)$/);
  if (!m) return -1;
  const want = m[1].replace('-', '–');
  return DATA.findIndex(v => v.ref === want);
}
function buildList() {
  const byCh = {};
  DATA.forEach((v, i) => (byCh[v.ch] ||= []).push(i));
  $('list').innerHTML = Object.keys(byCh).map(Number).sort((a, b) => a - b).map(ch =>
    `<h2>Chapter ${ch}</h2><ol>` + byCh[ch].map(i =>
      `<li><span>${DATA[i].ref}</span><a href="#${DATA[i].ref.replace('–','-')}" data-i="${i}">${DATA[i].h}</a></li>`).join('') + '</ol>').join('');
}
$('draw').addEventListener('click', draw);
$('toggle').addEventListener('click', () => {
  const l = $('list'); l.hidden = !l.hidden;
  $('toggle').textContent = l.hidden ? 'All verses' : 'Hide list';
});
$('list').addEventListener('click', e => {
  const a = e.target.closest('a[data-i]'); if (!a) return;
  e.preventDefault(); render(+a.dataset.i); window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowRight') { if (e.target.tagName !== 'BUTTON') { e.preventDefault(); draw(); } }
});
$('count').textContent = DATA.length;
buildList();
const h = fromHash();
if (h >= 0) render(h); else { shuffle(); render(deck.pop()); }
</script>
